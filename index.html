<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8E2638">
<title>Какой у тебя отрядный архетип?</title>
<style>
:root{
  --burgundy:#8E2638;
  --blue:#74C4DF;
  --cream:#F5F4F0;
  --graphite:#25262A;
  --gray:#A8ADB3;
  --white:#FFFFFF;
  --light-blue:#E7F5F8;
  --light-burgundy:#F3E6E9;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--cream);
}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--cream);
  color:var(--graphite);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:var(--blue);
  opacity:.12;
  top:-180px;
  right:-150px;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  background:var(--burgundy);
  opacity:.07;
  bottom:-180px;
  left:-150px;
  z-index:-1;
}

.app{
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:24px 16px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.brand{
  font-weight:900;
  font-size:15px;
  letter-spacing:.04em;
  color:var(--burgundy);
  text-transform:uppercase;
}

.progress{
  font-size:13px;
  color:var(--gray);
  font-weight:800;
  white-space:nowrap;
}

.card{
  background:var(--white);
  border:2px solid var(--graphite);
  border-radius:28px;
  padding:30px;
  box-shadow:8px 8px 0 var(--burgundy);
}

h1{
  font-size:clamp(34px,8vw,58px);
  line-height:.98;
  margin:0 0 20px;
  letter-spacing:-.055em;
  color:var(--graphite);
  font-weight:900;
}

h2{
  font-size:clamp(26px,6vw,40px);
  line-height:1.05;
  letter-spacing:-.04em;
  margin:0 0 22px;
  color:var(--graphite);
  font-weight:900;
}

p{
  line-height:1.5;
}

.lead{
  font-size:17px;
  color:#55575C;
  max-width:620px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:9px 14px;
  border-radius:999px;
  background:var(--blue);
  color:var(--graphite);
  font-weight:900;
  font-size:13px;
  letter-spacing:.02em;
  margin-bottom:20px;
}

.btn{
  border:2px solid var(--burgundy);
  border-radius:16px;
  padding:15px 20px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  transition:.18s transform,.18s box-shadow,.18s background;
  background:var(--burgundy);
  color:var(--white);
  box-shadow:4px 4px 0 var(--graphite);
}

.btn:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--graphite);
}

.btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--graphite);
}

.btn.secondary{
  background:var(--white);
  color:var(--burgundy);
  border:2px solid var(--burgundy);
  box-shadow:none;
}

.btn.secondary:hover{
  background:var(--light-burgundy);
  box-shadow:none;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:26px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--white);
  border:2px solid var(--gray);
  border-radius:17px;
  padding:19px 20px;
  margin:12px 0;
  font-size:19px;
  line-height:1.35;
  font-weight:700;
  color:var(--graphite);
  cursor:pointer;
  transition:.18s transform,.18s border-color,.18s background;
}

.option:hover,
.option:focus{
  border-color:var(--blue);
  background:var(--light-blue);
  outline:none;
  transform:translateX(3px);
}

.option.selected{
  border-color:var(--burgundy);
  background:var(--light-burgundy);
  box-shadow:4px 4px 0 var(--blue);
}

.progressbar{
  height:10px;
  background:#DDE1E4;
  border-radius:99px;
  overflow:hidden;
  margin:0 0 28px;
  border:1px solid var(--gray);
}

.progressbar>div{
  height:100%;
  background:var(--burgundy);
  border-radius:99px;
  transition:.25s;
}

.result-mark{
  width:92px;
  height:92px;
  border-radius:24px;
  background:var(--blue);
  color:var(--graphite);
  display:grid;
  place-items:center;
  font-size:44px;
  margin-bottom:20px;
  border:2px solid var(--graphite);
}

.result-name{
  font-size:clamp(34px,8vw,52px);
  line-height:1;
  letter-spacing:-.05em;
  margin:0 0 16px;
  color:var(--burgundy);
  font-weight:900;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.tag{
  padding:8px 12px;
  border-radius:999px;
  background:var(--light-blue);
  color:var(--graphite);
  border:1px solid var(--blue);
  font-weight:800;
  font-size:13px;
}

.note{
  font-size:13px;
  color:var(--gray);
  margin-top:20px;
}

.footer{
  text-align:center;
  color:var(--gray);
  font-size:12px;
  margin-top:24px;
}

.hidden{
  display:none!important;
}

#result{
  box-shadow:8px 8px 0 var(--blue);
}

#result .badge{
  background:var(--blue);
}

@media(max-width:520px){
  .app{
    padding:14px 12px 30px;
  }

  .card{
    padding:22px;
    border-radius:23px;
    box-shadow:6px 6px 0 var(--burgundy);
  }

  #result{
    box-shadow:6px 6px 0 var(--blue);
  }

  .option{
    padding:15px 16px;
  }

  .brand{
    font-size:13px;
  }

  .top{
    margin-bottom:16px;
  }
}
</style>
</head>
<body>
<div class="app">
<div class="card">

<div id="start">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<h1>Какой у тебя<br>отрядный архетип?</h1>
<p>Ответь на 7 вопросов и узнай, какую роль ты чаще всего берёшь на себя в отряде.</p>
<button class="btn" onclick="start()">Начать тест</button>
<p class="small">7 вопросов · 14 архетипов</p>
</div>

<div id="quiz" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="num" id="num"></div>
<div class="progress"><i id="bar"></i></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
</div>

<div id="result" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="result">
<div class="tag">ТВОЙ ОТРЯДНЫЙ АРХЕТИП</div>
<h2 id="rtitle"></h2>
<p id="rtext"></p>
</div>
<button class="btn alt" onclick="restart()">Пройти ещё раз</button>
</div>

</div>
</div>

<script>
/* ================================
   ТЕСТ «КАКОЙ У ТЕБЯ ОТРЯДНЫЙ АРХЕТИП?»
   7 вопросов · 14 архетипов
================================ */

const archetypes = {
  leader: {
    name: "Лидер",
    icon: "★",
    desc: "Ты тот человек, который не боится брать ответственность и вести команду за собой. В сложной ситуации на тебя можно положиться.",
    tags: ["ответственность", "решительность", "команда"]
  },

  soul: {
    name: "Душа отряда",
    icon: "♡",
    desc: "Ты создаёшь ту самую атмосферу, ради которой хочется возвращаться в отряд. Рядом с тобой легко, весело и по-настоящему тепло.",
    tags: ["атмосфера", "общение", "поддержка"]
  },

  organizer: {
    name: "Организатор",
    icon: "▣",
    desc: "Ты умеешь превращать идеи в конкретный план. Сроки, задачи и детали — всё оказывается под контролем.",
    tags: ["порядок", "планирование", "контроль"]
  },

  creator: {
    name: "Креатор",
    icon: "✦",
    desc: "Тебе постоянно приходят новые идеи. Ты умеешь видеть необычное там, где другие видят обычное, и превращать мысли в нечто настоящее.",
    tags: ["идеи", "творчество", "эксперименты"]
  },

  media: {
    name: "Медиа",
    icon: "◉",
    desc: "Ты умеешь замечать моменты, которые хочется сохранить и показать другим. Камера, текст, дизайн или соцсети — твоя стихия.",
    tags: ["контент", "визуал", "истории"]
  },

  teammate: {
    name: "Командный игрок",
    icon: "∞",
    desc: "Ты ценишь команду и умеешь быть её частью. Для тебя общий результат важнее личного признания.",
    tags: ["команда", "взаимопомощь", "доверие"]
  },

  initiator: {
    name: "Инициатор",
    icon: "→",
    desc: "Ты не ждёшь, пока кто-то сделает первый шаг. Если видишь возможность — предлагаешь, пробуешь и запускаешь движение.",
    tags: ["инициатива", "действие", "смелость"]
  },

  explorer: {
    name: "Исследователь",
    icon: "⌁",
    desc: "Тебе интересно пробовать новое, знакомиться с людьми и выходить за пределы привычного. Каждый новый опыт для тебя — возможность вырасти.",
    tags: ["новое", "опыт", "развитие"]
  },

  mentor: {
    name: "Наставник",
    icon: "◇",
    desc: "Ты умеешь объяснять, помогать и замечать, когда кому-то нужна поддержка. Тебе важно, чтобы рядом развивались не только ты, но и другие.",
    tags: ["знания", "помощь", "развитие"]
  },

  motivator: {
    name: "Мотиватор",
    icon: "↑",
    desc: "Ты умеешь зажигать людей общей идеей. Когда команда устала или сомневается, именно ты помогаешь снова поверить в результат.",
    tags: ["энергия", "вдохновение", "движение"]
  },

  strategist: {
    name: "Стратег",
    icon: "⌖",
    desc: "Ты привык сначала подумать, а потом действовать. Видишь несколько шагов вперёд и умеешь находить наиболее разумное решение.",
    tags: ["логика", "анализ", "тактика"]
  },

  energizer: {
    name: "Энерджайзер",
    icon: "⚡",
    desc: "Твоей энергии хватает на несколько человек. Ты легко включаешься в происходящее и помогаешь команде не сбавлять темп.",
    tags: ["энергия", "активность", "настроение"]
  },

  reliable: {
    name: "Надёжный человек",
    icon: "✓",
    desc: "Если ты сказал, что сделаешь — можно не переживать. Ты умеешь держать слово и спокойно доводить начатое до конца.",
    tags: ["надёжность", "дисциплина", "результат"]
  },

  free: {
    name: "Свободный дух",
    icon: "✧",
    desc: "Ты не любишь рамки и шаблоны. Тебе важно оставаться собой, искать свой путь и делать всё по-своему.",
    tags: ["свобода", "самобытность", "характер"]
  }
};


/* =================================
   7 ВОПРОСОВ
   Каждый архетип встречается
   ровно 2 раза среди ответов
================================= */

const questions = [

  {
    q: "В отряде появляется новая задача. Твоя первая реакция?",
    image: "question-1.svg.jpg",
    options: [
      ["Соберу всех и распределю, кто чем займётся.", "leader"],
      ["Придумаю необычный способ сделать это.", "creator"],
      ["Сначала разберусь во всех деталях.", "strategist"],
      ["Сразу предложу начать и подключусь сам.", "initiator"]
    ]
  },

  {
    q: "Что ты обычно делаешь, когда команда начинает уставать?",
    image: "question-2.svg.jpg",
    options: [
      ["Придумаю, как поднять настроение.", "energizer"],
      ["Помогу тем, кому сейчас сложнее всего.", "mentor"],
      ["Напомню всем, ради чего мы это делаем.", "motivator"],
      ["Возьму часть работы на себя.", "reliable"]
    ]
  },

  {
    q: "Что тебе интереснее всего во время отрядной жизни?",
    image: "question-3.svg.jpg",
    options: [
      ["Снимать, фотографировать и создавать контент.", "media"],
      ["Знакомиться с новыми людьми и пробовать новое.", "explorer"],
      ["Создавать атмосферу и проводить время вместе.", "soul"],
      ["Находить свой собственный способ делать вещи.", "free"]
    ]
  },

  {
    q: "Представь, что нужно подготовить большое мероприятие. Какая роль тебе ближе?",
    image: "question-4.svg.jpg",
    options: [
      ["Следить за планом, сроками и деталями.", "organizer"],
      ["Придумывать концепцию и оформление.", "creator"],
      ["Объединять людей и следить за общей атмосферой.", "teammate"],
      ["Продумать стратегию и возможные варианты.", "strategist"]
    ]
  },

  {
    q: "Кто-то из ребят говорит: «У меня не получится». Что ты сделаешь?",
    image: "question-5.svg.jpg",
    options: [
      ["Скажу: «Давай попробуем вместе».", "teammate"],
      ["Помогу разобраться и объясню, как сделать.", "mentor"],
      ["Подбодрю и напомню, сколько уже получилось.", "motivator"],
      ["Просто буду рядом и поддержу.", "soul"]
    ]
  },

  {
    q: "Какой комплимент тебе было бы приятнее всего услышать?",
    image: "question-6.svg.jpg",
    options: [
      ["«На тебя всегда можно положиться».", "reliable"],
      ["«С тобой никогда не бывает скучно».", "energizer"],
      ["«У тебя всегда классные идеи».", "media"],
      ["«Ты умеешь вести за собой».", "leader"]
    ]
  },

  {
    q: "Если бы твой отряд мог попробовать что-то совершенно новое, ты бы…",
    image: "question-7.svg.jpg",
    options: [
      ["Первым предложил попробовать.", "initiator"],
      ["Сразу согласился — люблю новый опыт.", "explorer"],
      ["Сделал всё по-своему и добавил индивидуальности.", "free"],
      ["Организовал так, чтобы всё получилось.", "organizer"]
    ]
  }

];


/* =================================
   ПЕРЕМЕННЫЕ
================================= */

let current = 0;
let answers = [];


/* =================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
================================= */

function $(id) {
  return document.getElementById(id);
}

function showScreen(screen) {
  $("start").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");

  $(screen).classList.remove("hidden");
}


/* =================================
   СТАРТ
================================= */

function start() {
  current = 0;
  answers = [];
  showScreen("quiz");
  render();
}


/* =================================
   ОТОБРАЖЕНИЕ ВОПРОСА
================================= */

function render() {

  const item = questions[current];

  $("num").textContent =
    "ВОПРОС " + (current + 1) + " ИЗ " + questions.length;

  $("bar").style.width =
    ((current + 1) / questions.length * 100) + "%";

  $("question").textContent = item.q;

  /* Удаляем старую картинку */
  const oldImage = document.querySelector(".question-image");
  if (oldImage) {
    oldImage.remove();
  }

  /* Создаём область для картинки */
  if (item.image) {

    const imageWrap = document.createElement("div");
    imageWrap.className = "question-image";

    imageWrap.style.cssText = `
      width: 100%;
      max-width: 520px;
      height: 170px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    `;

    const img = document.createElement("img");

    img.src = item.image;
    img.alt = "";
    img.style.cssText = `
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    `;

    /*
      Если картинки question-1.svg и т.д.
      ещё не загружены — блок автоматически скрывается.
    */
    img.onerror = function() {
      imageWrap.style.display = "none";
    };

    imageWrap.appendChild(img);

    $("question").parentNode.insertBefore(
      imageWrap,
      $("question")
    );
  }


  /* Варианты ответов */
  $("answers").innerHTML = "";

  item.options.forEach(function(option, index) {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "option";
    button.textContent = option[0];

    if (answers[current] === index) {
      button.classList.add("selected");
    }

    button.onclick = function() {

      answers[current] = index;

      /* Убираем выделение со всех вариантов */
      document
        .querySelectorAll("#answers .option")
        .forEach(function(btn) {
          btn.classList.remove("selected");
        });

      button.classList.add("selected");

      renderNavigation();
    };

    $("answers").appendChild(button);
  });

  renderNavigation();
}


/* =================================
   КНОПКИ НАЗАД / ДАЛЕЕ
================================= */

function renderNavigation() {

  const oldNav = document.querySelector(".quiz-navigation");

  if (oldNav) {
    oldNav.remove();
  }

  const navigation = document.createElement("div");

  navigation.className = "quiz-navigation";

  navigation.style.cssText = `
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
  `;


  /* Кнопка назад */

  if (current > 0) {

    const back = document.createElement("button");

    back.type = "button";
    back.className = "btn alt";
    back.textContent = "← Назад";

    back.onclick = function() {
      current--;
      render();
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    navigation.appendChild(back);
  }


  /* Кнопка далее появляется после ответа */

  if (answers[current] !== undefined) {

    const next = document.createElement("button");

    next.type = "button";
    next.className = "btn";

    next.textContent =
      current === questions.length - 1
        ? "Узнать результат"
        : "Далее →";

    next.onclick = function() {

      if (current < questions.length - 1) {

        current++;

        render();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } else {

        showResult();

      }
    };

    navigation.appendChild(next);
  }


  $("answers").appendChild(navigation);
}


/* =================================
   ПОДСЧЁТ РЕЗУЛЬТАТА
================================= */

function calculate() {

  const scores = {};

  Object.keys(archetypes).forEach(function(key) {
    scores[key] = 0;
  });


  /*
    Каждый выбранный ответ даёт +2 балла
    соответствующему архетипу.
  */

  answers.forEach(function(answerIndex, questionIndex) {

    if (answerIndex === undefined) return;

    const archetype =
      questions[questionIndex].options[answerIndex][1];

    scores[archetype] += 2;
  });


  /* Ищем максимальный результат */

  let best = null;
  let bestScore = -1;

  /*
    При равенстве используется первый выбранный
    архетип — это делает систему стабильной.
  */

  for (let i = 0; i < answers.length; i++) {

    const answerIndex = answers[i];

    if (answerIndex === undefined) continue;

    const archetype =
      questions[i].options[answerIndex][1];

    if (scores[archetype] > bestScore) {

      bestScore = scores[archetype];
      best = archetype;
    }
  }


  return best;
}


/* =================================
   РЕЗУЛЬТАТ
================================= */

function showResult() {

  const resultKey = calculate();

  const result = archetypes[resultKey];

  showScreen("result");


  $("rtitle").textContent =
    result.icon + " " + result.name;

  $("rtext").textContent =
    result.desc;


  /* Удаляем старые дополнительные элементы */

  const oldExtra =
    document.querySelector(".result-extra");

  if (oldExtra) {
    oldExtra.remove();
  }


  /* Создаём теги */

  const extra = document.createElement("div");

  extra.className = "result-extra";

  extra.style.cssText = `
    margin-top: 18px;
  `;


  const tags = document.createElement("div");

  tags.className = "tags";

  result.tags.forEach(function(tag) {

    const span = document.createElement("span");

    span.className = "tag";
    span.textContent = tag;

    tags.appendChild(span);
  });


  extra.appendChild(tags);


  $("rtext").parentNode.appendChild(extra);
}


/* =================================
   ПРОЙТИ ЕЩЁ РАЗ
================================= */

function restart() {

  current = 0;
  answers = [];

  showScreen("start");
}


/* =================================
   ЗАЩИТА ОТ ОШИБОК
================================= */

window.start = start;
window.restart = restart;

</script>
