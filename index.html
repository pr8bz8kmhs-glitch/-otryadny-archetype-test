<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8E2638">
<title>Какой у тебя отрядный архетип?</title>
<style>
:root{
  --burgundy:#8E2638;
  --blue:#74C4DF;
  --cream:#F5F4F0;
  --graphite:#25262A;
  --gray:#A8ADB3;
  --white:#FFFFFF;
  --light-blue:#E7F5F8;
  --light-burgundy:#F3E6E9;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--cream);
}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--cream);
  color:var(--graphite);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:var(--blue);
  opacity:.12;
  top:-180px;
  right:-150px;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  background:var(--burgundy);
  opacity:.07;
  bottom:-180px;
  left:-150px;
  z-index:-1;
}

.app{
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:24px 16px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.brand{
  font-weight:900;
  font-size:15px;
  letter-spacing:.04em;
  color:var(--burgundy);
  text-transform:uppercase;
}

.progress{
  font-size:13px;
  color:var(--gray);
  font-weight:800;
  white-space:nowrap;
}

.card{
  background:var(--white);
  border:2px solid var(--graphite);
  border-radius:28px;
  padding:30px;
  box-shadow:8px 8px 0 var(--burgundy);
}

h1{
  font-size:clamp(34px,8vw,58px);
  line-height:.98;
  margin:0 0 20px;
  letter-spacing:-.055em;
  color:var(--graphite);
  font-weight:900;
}

h2{
  font-size:clamp(26px,6vw,40px);
  line-height:1.05;
  letter-spacing:-.04em;
  margin:0 0 22px;
  color:var(--graphite);
  font-weight:900;
}

p{
  line-height:1.5;
}

.lead{
  font-size:17px;
  color:#55575C;
  max-width:620px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:9px 14px;
  border-radius:999px;
  background:var(--blue);
  color:var(--graphite);
  font-weight:900;
  font-size:13px;
  letter-spacing:.02em;
  margin-bottom:20px;
}

.btn{
  border:2px solid var(--burgundy);
  border-radius:16px;
  padding:15px 20px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  transition:.18s transform,.18s box-shadow,.18s background;
  background:var(--burgundy);
  color:var(--white);
  box-shadow:4px 4px 0 var(--graphite);
}

.btn:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--graphite);
}

.btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--graphite);
}

.btn.secondary{
  background:var(--white);
  color:var(--burgundy);
  border:2px solid var(--burgundy);
  box-shadow:none;
}

.btn.secondary:hover{
  background:var(--light-burgundy);
  box-shadow:none;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:26px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--white);
  border:2px solid var(--gray);
  border-radius:17px;
  padding:17px 18px;
  margin:11px 0;
  font-size:16px;
  font-weight:750;
  color:var(--graphite);
  cursor:pointer;
  transition:.18s transform,.18s border-color,.18s background;
}

.option:hover,
.option:focus{
  border-color:var(--blue);
  background:var(--light-blue);
  outline:none;
  transform:translateX(3px);
}

.option.selected{
  border-color:var(--burgundy);
  background:var(--light-burgundy);
  box-shadow:4px 4px 0 var(--blue);
}

.progressbar{
  height:10px;
  background:#DDE1E4;
  border-radius:99px;
  overflow:hidden;
  margin:0 0 28px;
  border:1px solid var(--gray);
}

.progressbar>div{
  height:100%;
  background:var(--burgundy);
  border-radius:99px;
  transition:.25s;
}

.result-mark{
  width:92px;
  height:92px;
  border-radius:24px;
  background:var(--blue);
  color:var(--graphite);
  display:grid;
  place-items:center;
  font-size:44px;
  margin-bottom:20px;
  border:2px solid var(--graphite);
}

.result-name{
  font-size:clamp(34px,8vw,52px);
  line-height:1;
  letter-spacing:-.05em;
  margin:0 0 16px;
  color:var(--burgundy);
  font-weight:900;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.tag{
  padding:8px 12px;
  border-radius:999px;
  background:var(--light-blue);
  color:var(--graphite);
  border:1px solid var(--blue);
  font-weight:800;
  font-size:13px;
}

.note{
  font-size:13px;
  color:var(--gray);
  margin-top:20px;
}

.footer{
  text-align:center;
  color:var(--gray);
  font-size:12px;
  margin-top:24px;
}

.hidden{
  display:none!important;
}

#result{
  box-shadow:8px 8px 0 var(--blue);
}

#result .badge{
  background:var(--blue);
}

@media(max-width:520px){
  .app{
    padding:14px 12px 30px;
  }

  .card{
    padding:22px;
    border-radius:23px;
    box-shadow:6px 6px 0 var(--burgundy);
  }

  #result{
    box-shadow:6px 6px 0 var(--blue);
  }

  .option{
    padding:15px 16px;
  }

  .brand{
    font-size:13px;
  }

  .top{
    margin-bottom:16px;
  }
}
</style>
</head>
<body>
<div class="app">
<div class="card">

<div id="start">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<h1>Какой у тебя<br>отрядный архетип?</h1>
<p>Ответь на 7 вопросов и узнай, какую роль ты чаще всего берёшь на себя в отряде.</p>
<button class="btn" onclick="start()">Начать тест</button>
<p class="small">7 вопросов · 14 архетипов</p>
</div>

<div id="quiz" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="num" id="num"></div>
<div class="progress"><i id="bar"></i></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
</div>

<div id="result" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="result">
<div class="tag">ТВОЙ ОТРЯДНЫЙ АРХЕТИП</div>
<h2 id="rtitle"></h2>
<p id="rtext"></p>
</div>
<button class="btn alt" onclick="restart()">Пройти ещё раз</button>
</div>

</div>
</div>

<script>
const archetypes={
"Лидер":["Ты умеешь брать ответственность и вести за собой. Когда нужно принять решение, на тебя можно положиться."],
"Душа отряда":["Ты создаёшь ту самую атмосферу, ради которой хочется возвращаться в отряд. С тобой легко смеяться, общаться и быть собой."],
"Организатор":["Ты замечаешь детали, умеешь собрать людей и превратить идею в понятный план действий."],
"Творец":["Ты постоянно находишь нестандартные решения. Там, где другие видят обычную задачу, ты видишь пространство для творчества."],
"Медийщик":["Ты умеешь замечать интересные моменты и превращать их в историю, которую хочется показать другим."],
"Командный игрок":["Для тебя главное — команда. Ты умеешь поддержать других и работаешь так, чтобы общий результат становился лучше."],
"Инициатор":["Ты не ждёшь, пока кто-то начнёт первым. Если появилась идея — тебе хочется попробовать воплотить её в жизнь."],
"Исследователь":["Тебе интересно пробовать новое, узнавать людей и открывать возможности, которых раньше не замечал."],
"Наставник":["Ты умеешь спокойно объяснять, поддерживать и помогать другим становиться увереннее."],
"Мотиватор":["Ты умеешь заряжать окружающих энергией и находить слова, которые помогают не сдаваться."],
"Стратег":["Ты предпочитаешь сначала подумать, оценить варианты и только потом действовать. Ты видишь ситуацию на несколько шагов вперёд."],
"Энергетик":["Тебя сложно застать без дела. Ты быстро включаешься в активность и заряжаешь своим настроением окружающих."],
"Надёжный":["Если ты сказал, что сделаешь — скорее всего, так и будет. На тебя можно рассчитывать даже в сложной ситуации."],
"Свободный дух":["Ты ценишь самостоятельность и не боишься идти своим путём. Твои идеи часто отличаются от привычных."]
};

const questions=[
["В отряде появляется новая идея. Что ты делаешь первым?",[
["Предлагаю план и распределяю задачи","Лидер"],["Подхватываю идею и придумываю, как сделать её интереснее","Творец"],["Сразу рассказываю об этом и думаю над контентом","Медийщик"],["Зову остальных и предлагаю сделать вместе","Командный игрок"]
]],
["До мероприятия осталось мало времени. Твоя реакция?",[
["Беру задачу на себя и довожу до конца","Надёжный"],["Быстро собираю всех и начинаю действовать","Энергетик"],["Определяю приоритеты и план действий","Стратег"],["Предлагаю несколько необычных решений","Инициатор"]
]],
["В отряде появился новичок. Скорее всего ты...",[
["Помогу освоиться и познакомлю с ребятами","Душа отряда"],["Спокойно объясню, что и как устроено","Наставник"],["Предложу вместе попробовать что-нибудь новое","Исследователь"],["Поддержу и помогу поверить в себя","Мотиватор"]
]],
["Какую задачу тебе было бы интереснее получить?",[
["Организовать большое мероприятие","Организатор"],["Снять и оформить историю о жизни отряда","Медийщик"],["Придумать необычную концепцию","Творец"],["Самостоятельно придумать новый проект","Свободный дух"]
]],
["Что важнее всего во время общей работы?",[
["Чтобы каждый понимал свою задачу","Организатор"],["Чтобы никто не остался в стороне","Командный игрок"],["Чтобы у всех было хорошее настроение","Душа отряда"],["Чтобы команда не потеряла мотивацию","Мотиватор"]
]],
["Если что-то пошло не по плану, ты...",[
["Быстро принимаю решение и двигаюсь дальше","Лидер"],["Ищу причину и продумываю лучший вариант","Стратег"],["Придумываю новый ход","Инициатор"],["Сохраняю спокойствие и делаю то, что нужно","Надёжный"]
]],
["Как ты хочешь запомнить этот отрядный сезон?",[
["Как время, когда я многому научился","Исследователь"],["Как время ярких событий и эмоций","Энергетик"],["Как время, когда я помогал другим","Наставник"],["Как время, когда смог проявить себя по-своему","Свободный дух"]
]]
];

let q=0,score={};

function start(){
 q=0;score={};
 document.getElementById("start").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 show();
}

function show(){
 let x=questions[q];
 document.getElementById("num").textContent="ВОПРОС "+(q+1)+" ИЗ "+questions.length;
 document.getElementById("bar").style.width=((q+1)/questions.length*100)+"%";
 document.getElementById("question").textContent=x[0];
 let box=document.getElementById("answers");
 box.innerHTML="";
 x[1].forEach(a=>{
   let b=document.createElement("button");
   b.className="answer";
   b.textContent=a[0];
   b.onclick=()=>answer(a[1]);
   box.appendChild(b);
 });
}

function answer(type){
 score[type]=(score[type]||0)+1;
 q++;
 if(q<questions.length)show();
 else finish();
}

function finish(){
 let best=Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("rtitle").textContent=best;
 document.getElementById("rtext").textContent=archetypes[best][0];
}

function restart(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
}
</script>
</body>
</html>
