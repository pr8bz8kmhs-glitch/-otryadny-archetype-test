<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8E2638">
<title>Какой у тебя отрядный архетип?</title>
<style>
:root{
  --burgundy:#8E2638;
  --blue:#74C4DF;
  --cream:#F5F4F0;
  --graphite:#25262A;
  --gray:#A8ADB3;
  --white:#FFFFFF;
  --light-blue:#E7F5F8;
  --light-burgundy:#F3E6E9;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--cream);
}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--cream);
  color:var(--graphite);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:var(--blue);
  opacity:.12;
  top:-180px;
  right:-150px;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  background:var(--burgundy);
  opacity:.07;
  bottom:-180px;
  left:-150px;
  z-index:-1;
}

.app{
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:24px 16px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.brand{
  font-weight:900;
  font-size:15px;
  letter-spacing:.04em;
  color:var(--burgundy);
  text-transform:uppercase;
}

.progress{
  font-size:13px;
  color:var(--gray);
  font-weight:800;
  white-space:nowrap;
}

.card{
  background:var(--white);
  border:2px solid var(--graphite);
  border-radius:28px;
  padding:30px;
  box-shadow:8px 8px 0 var(--burgundy);
}

h1{
  font-size:clamp(34px,8vw,58px);
  line-height:.98;
  margin:0 0 20px;
  letter-spacing:-.055em;
  color:var(--graphite);
  font-weight:900;
}

h2{
  font-size:clamp(26px,6vw,40px);
  line-height:1.05;
  letter-spacing:-.04em;
  margin:0 0 22px;
  color:var(--graphite);
  font-weight:900;
}

p{
  line-height:1.5;
}

.lead{
  font-size:17px;
  color:#55575C;
  max-width:620px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:9px 14px;
  border-radius:999px;
  background:var(--blue);
  color:var(--graphite);
  font-weight:900;
  font-size:13px;
  letter-spacing:.02em;
  margin-bottom:20px;
}

.btn{
  border:2px solid var(--burgundy);
  border-radius:16px;
  padding:15px 20px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  transition:.18s transform,.18s box-shadow,.18s background;
  background:var(--burgundy);
  color:var(--white);
  box-shadow:4px 4px 0 var(--graphite);
}

.btn:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--graphite);
}

.btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--graphite);
}

.btn.secondary{
  background:var(--white);
  color:var(--burgundy);
  border:2px solid var(--burgundy);
  box-shadow:none;
}

.btn.secondary:hover{
  background:var(--light-burgundy);
  box-shadow:none;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:26px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--white);
  border:2px solid var(--gray);
  border-radius:17px;
  padding:19px 20px;
  margin:12px 0;
  font-size:19px;
  line-height:1.35;
  font-weight:700;
  color:var(--graphite);
  cursor:pointer;
  transition:.18s transform,.18s border-color,.18s background;
}

.option:hover,
.option:focus{
  border-color:var(--blue);
  background:var(--light-blue);
  outline:none;
  transform:translateX(3px);
}

.option.selected{
  border-color:var(--burgundy);
  background:var(--light-burgundy);
  box-shadow:4px 4px 0 var(--blue);
}

.progressbar{
  height:10px;
  background:#DDE1E4;
  border-radius:99px;
  overflow:hidden;
  margin:0 0 28px;
  border:1px solid var(--gray);
}

.progressbar>div{
  height:100%;
  background:var(--burgundy);
  border-radius:99px;
  transition:.25s;
}

.result-mark{
  width:92px;
  height:92px;
  border-radius:24px;
  background:var(--blue);
  color:var(--graphite);
  display:grid;
  place-items:center;
  font-size:44px;
  margin-bottom:20px;
  border:2px solid var(--graphite);
}

.result-name{
  font-size:clamp(34px,8vw,52px);
  line-height:1;
  letter-spacing:-.05em;
  margin:0 0 16px;
  color:var(--burgundy);
  font-weight:900;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.tag{
  padding:8px 12px;
  border-radius:999px;
  background:var(--light-blue);
  color:var(--graphite);
  border:1px solid var(--blue);
  font-weight:800;
  font-size:13px;
}

.note{
  font-size:13px;
  color:var(--gray);
  margin-top:20px;
}

.footer{
  text-align:center;
  color:var(--gray);
  font-size:12px;
  margin-top:24px;
}

.hidden{
  display:none!important;
}

#result{
  box-shadow:8px 8px 0 var(--blue);
}

#result .badge{
  background:var(--blue);
}

@media(max-width:520px){
  .app{
    padding:14px 12px 30px;
  }

  .card{
    padding:22px;
    border-radius:23px;
    box-shadow:6px 6px 0 var(--burgundy);
  }

  #result{
    box-shadow:6px 6px 0 var(--blue);
  }

  .option{
    padding:15px 16px;
  }

  .brand{
    font-size:13px;
  }

  .top{
    margin-bottom:16px;
  }
}
</style>
</head>
<body>
<div class="app">
<div class="card">

<div id="start">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<h1>Какой у тебя<br>отрядный архетип?</h1>
<p>Ответь на 7 вопросов и узнай, какую роль ты чаще всего берёшь на себя в отряде.</p>
<button class="btn" onclick="start()">Начать тест</button>
<p class="small">7 вопросов · 14 архетипов</p>
</div>

<div id="quiz" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="num" id="num"></div>
<div class="progress"><i id="bar"></i></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
</div>

<div id="result" class="hidden">
<div class="logo">ФОКУС НА МОЛОДЁЖЬ</div>
<div class="result">
<div class="tag">ТВОЙ ОТРЯДНЫЙ АРХЕТИП</div>
<h2 id="rtitle"></h2>
<p id="rtext"></p>
</div>
<button class="btn alt" onclick="restart()">Пройти ещё раз</button>
</div>

</div>
</div>

<script>
<script>
/*
  ТЕСТ «КАКОЙ У ТЕБЯ ОТРЯДНЫЙ АРХЕТИП?»

  7 вопросов × 4 варианта = 28 ответов.
  Каждый из 14 архетипов встречается ровно 2 раза.
  Каждый выбранный ответ = +2 балла своему архетипу.

  Картинки:
  Для каждого вопроса предусмотрено отдельное место.
  Позже сюда можно поставить реальные изображения:
  question-1.svg ... question-7.svg
*/

const archetypes = {
  leader:{
    name:"Лидер",
    icon:"⚡",
    desc:"Ты умеешь брать ответственность, задавать направление и собирать людей вокруг идеи. Когда начинается движ — ты скорее ведёшь, чем ждёшь.",
    tags:["инициатива","ответственность","решительность"]
  },

  soul:{
    name:"Душа отряда",
    icon:"☀️",
    desc:"Ты создаёшь ту самую атмосферу, ради которой хочется быть вместе. Легко находишь контакт с людьми и умеешь превращать обычный день в историю.",
    tags:["атмосфера","общение","эмоции"]
  },

  organizer:{
    name:"Организатор",
    icon:"◈",
    desc:"Ты замечаешь детали и превращаешь хаос в понятный план. На тебя можно положиться, когда нужно довести идею до результата.",
    tags:["структура","планирование","результат"]
  },

  creator:{
    name:"Творец",
    icon:"✦",
    desc:"Ты смотришь на привычные вещи под другим углом и постоянно находишь, как сделать интереснее. Идеи у тебя редко заканчиваются.",
    tags:["идеи","креатив","самовыражение"]
  },

  media:{
    name:"Медийщик",
    icon:"◎",
    desc:"Ты умеешь заметить момент, рассказать о нём и сделать так, чтобы его увидели другие. Камера, текст или дизайн — твой способ быть в центре событий.",
    tags:["контент","истории","визуал"]
  },

  teammate:{
    name:"Командный игрок",
    icon:"∞",
    desc:"Для тебя сила отряда — в людях. Ты слышишь других, поддерживаешь команду и умеешь работать не только ради личного результата.",
    tags:["команда","поддержка","взаимодействие"]
  },

  initiator:{
    name:"Инициатор",
    icon:"↗",
    desc:"Ты не ждёшь идеального момента — ты предлагаешь попробовать. Твоя энергия помогает идеям переходить из «а что если?» в «давайте сделаем».",
    tags:["старт","смелость","действие"]
  },

  explorer:{
    name:"Исследователь",
    icon:"⌕",
    desc:"Тебе интересно пробовать новое, задавать вопросы и выходить за привычные рамки. Ты быстро растёшь там, где есть пространство для эксперимента.",
    tags:["новизна","любопытство","опыт"]
  },

  mentor:{
    name:"Наставник",
    icon:"♡",
    desc:"Ты умеешь поддержать, объяснить и помочь человеку поверить в себя. Тебе важно, чтобы рядом росли не только ты, но и команда.",
    tags:["забота","знания","поддержка"]
  },

  motivator:{
    name:"Мотиватор",
    icon:"★",
    desc:"Ты умеешь зажигать людей общей целью. Даже когда усталость берёт своё, ты находишь слова и энергию, чтобы двигаться дальше.",
    tags:["энергия","вдохновение","цель"]
  },

  strategist:{
    name:"Стратег",
    icon:"⌁",
    desc:"Ты сначала смотришь на ситуацию целиком, а потом действуешь. Любишь продумывать ходы наперёд и видеть, к чему приведёт решение.",
    tags:["логика","план","тактика"]
  },

  energizer:{
    name:"Энергетик",
    icon:"⚡",
    desc:"Тебе сложно сидеть без дела — хочется движения, событий и новых впечатлений. Ты умеешь заряжать окружающих собственным темпом.",
    tags:["движение","темп","активность"]
  },

  reliable:{
    name:"Надёжный",
    icon:"✓",
    desc:"Если ты сказал, что сделаешь — команда может рассчитывать на результат. Спокойствие и стабильность часто оказываются именно тем, чего не хватает в аврале.",
    tags:["надёжность","дисциплина","дело"]
  },

  free:{
    name:"Свободный дух",
    icon:"↯",
    desc:"Ты ценишь самостоятельность и возможность делать по-своему. Не боишься отличаться и приносишь в команду свежий взгляд.",
    tags:["самостоятельность","характер","свобода"]
  }
};


/* =========================================================
   7 ВОПРОСОВ
   ========================================================= */

const questions = [

  {
    q:"Представь: отряду нужно сделать важное дело уже сегодня. Что ты делаешь первым?",
    image:"question-1.svg",
    imageAlt:"Команда готовится к важному делу",
    a:[
      ["Беру ответственность и задаю направление","leader"],
      ["Сначала смотрю на задачу целиком и продумываю шаги","strategist"],
      ["Предлагаю идею, как сделать всё интереснее","creator"],
      ["Спрашиваю, кому какая часть работы подходит","teammate"]
    ]
  },

  {
    q:"До большого события остаётся совсем мало времени, а дел ещё много. Твоя реакция?",
    image:"question-2.svg",
    imageAlt:"Команда готовится к событию в последний момент",
    a:[
      ["Быстро составляю понятный план и распределяю задачи","organizer"],
      ["Говорю: «Давайте я начну» — и запускаю работу","initiator"],
      ["Стараюсь зарядить остальных и не дать команде сдаться","motivator"],
      ["Выбираю конкретную задачу и спокойно довожу её до конца","reliable"]
    ]
  },

  {
    q:"Вам предлагают придумать новое отрядное мероприятие. Что тебя цепляет больше всего?",
    image:"question-3.svg",
    imageAlt:"Команда придумывает новое мероприятие",
    a:[
      ["Придумать яркую идею и необычную концепцию","creator"],
      ["Снять, оформить и рассказать об этом так, чтобы все заметили","media"],
      ["Попробовать формат, которого раньше не было","explorer"],
      ["Собрать всех вместе и создать классную атмосферу","soul"]
    ]
  },

  {
    q:"В отряд приходит новичок и пока чувствует себя немного неуверенно. Что ты скорее сделаешь?",
    image:"question-4.svg",
    imageAlt:"Новый участник знакомится с отрядом",
    a:[
      ["Объясню, помогу разобраться и поделюсь своим опытом","mentor"],
      ["Позову его в общую работу, чтобы он сразу почувствовал команду","teammate"],
      ["Постараюсь познакомить со всеми и сделать атмосферу комфортнее","soul"],
      ["Поддержу и помогу поверить, что у него всё получится","motivator"]
    ]
  },

  {
    q:"У тебя появился свободный день в отряде. Чем интереснее всего его заполнить?",
    image:"question-5.svg",
    imageAlt:"Свободный день и новые возможности",
    a:[
      ["Попробовать что-то новое, чего раньше не делал","explorer"],
      ["Придумать собственный формат и сделать всё по-своему","free"],
      ["Устроить что-нибудь активное и не сидеть на месте","energizer"],
      ["Создать фото, видео или другую историю про этот день","media"]
    ]
  },

  {
    q:"Команда столкнулась со сложной задачей. Какую роль ты обычно берёшь на себя?",
    image:"question-6.svg",
    imageAlt:"Команда решает сложную задачу",
    a:[
      ["Навожу порядок: кто, что и когда делает","organizer"],
      ["Помогаю человеку разобраться и понять, как справиться","mentor"],
      ["Продумываю несколько шагов вперёд и выбираю лучший вариант","strategist"],
      ["Беру на себя свою часть и слежу, чтобы она была сделана","reliable"]
    ]
  },

  {
    q:"Большое дело закончилось. Какая мысль больше всего похожа на тебя?",
    image:"question-7.svg",
    imageAlt:"Команда завершила большое дело",
    a:[
      ["«Класс, теперь я хочу попробовать что-нибудь ещё!»","energizer"],
      ["«А что можно сделать следующим?» — и уже хочется начинать","initiator"],
      ["«Я сделал это по-своему — и мне это нравится»","free"],
      ["«Главное, что команда смогла сделать это вместе»","leader"]
    ]
  }

];


/* =========================================================
   СОСТОЯНИЕ ТЕСТА
   ========================================================= */

let current = 0;
let answers = Array(questions.length).fill(null);

const $ = id => document.getElementById(id);


/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
   ========================================================= */

function show(id){
  ["start","quiz","result"].forEach(x=>{
    $(x).classList.toggle("hidden",x!==id);
  });
}


/* =========================================================
   ОТОБРАЖЕНИЕ ВОПРОСА
   ========================================================= */

function render(){

  const item = questions[current];

  $("quiz").classList.remove("fade-in");
  void $("quiz").offsetWidth;
  $("quiz").classList.add("fade-in");

  $("progressKicker").textContent =
    `Вопрос ${current+1} из ${questions.length}`;

  $("progressDots").innerHTML =
    questions.map((_,i)=>`
      <span class="progress-dot
        ${i<current ? "done" : ""}
        ${i===current ? "current" : ""}
      "></span>
    `).join("");

  $("progressText").textContent =
    `${current+1} / ${questions.length}`;

  $("bar").style.width =
    `${(current/questions.length)*100}%`;


  /* ---------- КАРТИНКА ВОПРОСА ---------- */

  $("question").innerHTML = `

    <div class="question-kicker">
      Твоя интуиция
    </div>

    <div class="question-image">
      <img
        src="${item.image}"
        alt="${item.imageAlt}"
        onerror="this.parentElement.classList.add('image-placeholder'); this.style.display='none';"
      >

      <div class="image-placeholder-content">
        <span>МЕСТО ДЛЯ КАРТИНКИ</span>
        <small>question-${current+1}.svg</small>
      </div>
    </div>

    <h2>${item.q}</h2>
  `;


  /* ---------- ВАРИАНТЫ ---------- */

  $("options").innerHTML = "";

  item.a.forEach(([text,key],i)=>{

    const b = document.createElement("button");

    b.className =
      "option" +
      (answers[current]===i ? " selected" : "");

    b.setAttribute(
      "data-number",
      String(i+1).padStart(2,"0")
    );

    b.textContent = text;

    b.onclick = ()=>{

      answers[current] = i;

      render();

    };

    $("options").appendChild(b);

  });


  $("nextBtn").disabled =
    answers[current] === null;

  $("backBtn").style.visibility =
    current===0 ? "hidden" : "visible";
}


/* =========================================================
   ПОДСЧЁТ РЕЗУЛЬТАТА
   ========================================================= */

function calculate(){

  const scores = {};

  Object.keys(archetypes).forEach(key=>{
    scores[key] = 0;
  });


  /*
    Каждый ответ = +2 балла.
    Таким образом каждый архетип встречается
    ровно в двух вариантах ответа.
  */

  answers.forEach((ans,qi)=>{

    if(ans === null) return;

    const key =
      questions[qi].a[ans][1];

    scores[key] += 2;

  });


  /*
    Если несколько архетипов набрали одинаковое
    количество баллов, выбираем тот, который
    встретился раньше в тесте.
  */

  let best = null;
  let bestScore = -1;

  answers.forEach((ans,qi)=>{

    if(ans === null) return;

    const key =
      questions[qi].a[ans][1];

    if(scores[key] > bestScore){

      best = key;
      bestScore = scores[key];

    }

  });

  return best;
}


/* =========================================================
   ПОКАЗ РЕЗУЛЬТАТА
   ========================================================= */

function showResult(){

  $("bar").style.width = "100%";

  const key = calculate();
  const r = archetypes[key];

  $("resultIcon").textContent = r.icon;

  $("resultName").textContent = r.name;

  $("resultDescription").textContent =
    r.desc;

  $("resultTags").innerHTML =
    r.tags.map(x=>`
      <span class="tag">${x}</span>
    `).join("");

  $("progressText").textContent = "";

  show("result");
}


/* =========================================================
   КНОПКИ
   ========================================================= */

$("startBtn").onclick = ()=>{

  current = 0;

  answers.fill(null);

  show("quiz");

  render();

};


$("nextBtn").onclick = ()=>{

  if(current < questions.length - 1){

    current++;

    render();

  }else{

    showResult();

  }

};


$("backBtn").onclick = ()=>{

  if(current > 0){

    current--;

    render();

  }

};


$("restartBtn").onclick = ()=>{

  show("quiz");

  current = 0;

  answers.fill(null);

  render();

};


/* =========================================================
   ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ
   ========================================================= */

$("copyBtn").onclick = async ()=>{

  const text =
    `Я прошёл(ла) тест «Какой у тебя отрядный архетип?» и мой результат — ${$("resultName").textContent}.`;

  try{

    await navigator.clipboard.writeText(text);

    $("copyBtn").textContent =
      "Результат скопирован ✓";

    setTimeout(()=>{

      $("copyBtn").textContent =
        "Поделиться результатом";

    },1800);

  }catch(e){

    prompt(
      "Скопируй текст:",
      text
    );

  }

};
</script>
</script>
</body>
</html>
